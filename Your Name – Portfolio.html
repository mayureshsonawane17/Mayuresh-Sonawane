<style>
:root{--bg:#f6f5f0;--ink:#16161a;--mute:#6d6d72;--line:rgba(22,22,26,.07);--red:#d9252b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--ink:#f1efe8;--mute:#9a9aa0;--line:rgba(241,239,232,.08)}}
:root[data-theme="dark"]{--bg:#121214;--ink:#f1efe8;--mute:#9a9aa0;--line:rgba(241,239,232,.08)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.hero{position:relative;height:100%;overflow:hidden;touch-action:none}
.lines{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--line);stroke-width:1.5}
header{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:flex-start;padding:clamp(16px,2.4vw,32px);z-index:3}
.mark{font-weight:800;font-size:clamp(26px,3.4vw,46px);line-height:.88;letter-spacing:-.04em;margin:0}
nav{display:flex;gap:8px}
nav a{color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;padding:11px 18px;border:2px solid var(--ink);border-radius:12px;transition:background .2s,color .2s}
nav a:hover{background:var(--ink);color:var(--bg)}
nav a:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.stage{position:absolute;bottom:0;left:50%;width:min(100vw,94vh);aspect-ratio:1;transform:translateX(-50%);animation:rise 1.2s cubic-bezier(.7,0,.2,1) both;z-index:1}
.stage img{display:none}.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#rev{clip-path:polygon(0 0,0 0,0 100%,0 100%)}
@keyframes rise{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
.hint{position:absolute;left:clamp(16px,2.4vw,32px);bottom:calc(clamp(16px,2.4vw,32px) + env(safe-area-inset-bottom,0px));margin:0;max-width:15ch;font-size:clamp(14px,1.3vw,18px);line-height:1.25;color:var(--mute);z-index:3;animation:fade 1s 1.4s both}
.hint b{color:var(--ink);font-weight:700}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.stage,.hint{animation:none}}
</style>
</head>

  sh.push({i:q,x:.5,y:.4,vx:0,vy:0,R:0,vR:0,k:KS[q],sz:SZ[q],ox:Math.cos(q*2.4+1)*d,oy:Math.sin(q*2.4+1)*d,ph:q*1.9,ang:0,st:0});
}
function fit(){S=stage.clientWidth||600;D=Math.min(window.devicePixelRatio||1,2);cv.width=cv.height=Math.round(S*D);dirty=true}
fit();
if(window.ResizeObserver)new ResizeObserver(fit).observe(stage);else addEventListener('resize',fit);
bi.onload=ri.onload=function(){dirty=true};
function active(){for(var i=0;i<sh.length;i++)if(sh[i].R>.003)return true;return false}
function move(e){
  var r=stage.getBoundingClientRect(),now=performance.now();
  var px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
  intro=false;
  if(px>-.1&&px<1.1&&py>-.1&&py<1.1){
    if(!active())sh.forEach(function(s){s.x=px+s.ox;s.y=py+s.oy;s.vx=s.vy=0});
    tx=px;ty=py;lm=now;
  }else lm=Math.min(lm,now-500);
}
function leave(){lm=Math.min(lm,performance.now()-500)}
hero.addEventListener('pointermove',move);
hero.addEventListener('pointerdown',move);
hero.addEventListener('pointerup',function(e){if(e.pointerType!=='mouse')leave()});
hero.addEventListener('pointerleave',leave);
/* one smooth, wobbling, velocity-stretched blob outline */
function loop(x,y,R,st,ang,ph,wob,eps){
  var n=44,c=Math.cos(ang),sn=Math.sin(ang);
  for(var k=0;k<n;k++){
    var a=k/n*TAU,w=1+wob*(.13*Math.sin(2*a+T*1.3+ph)+.1*Math.sin(3*a-T*1.7+ph*1.7)+.05*Math.sin(5*a+T*2.3+ph*.6));
    var rr=R*w+eps,ux=Math.cos(a)*rr*(1+st),uy=Math.sin(a)*rr/(1+st*.55);
    var X=x+ux*c-uy*sn,Y=y+ux*sn+uy*c;
    if(k)ctx.lineTo(X,Y);else ctx.moveTo(X,Y);
  }
  ctx.closePath();
}
function trace(eps){
  ctx.beginPath();
  for(var i=0;i<sh.length;i++){
    var a=sh[i];if(a.R<=.003)continue;
    loop(a.x,a.y,a.R,a.st,a.ang,a.ph,1,eps);
    var b=sh[i+1];
    if(b&&b.R>.003){                       /* slime bridge: a string of shrinking beads joins neighbouring blobs */
      for(var m=1;m<=4;m++){var f=m/5;loop(a.x+(b.x-a.x)*f,a.y+(b.y-a.y)*f,(a.R+(b.R-a.R)*f)*.9,0,0,a.ph+m,.6,eps)}
    }
  }
}
function draw(act){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(S*D,0,0,S*D,0,0);ctx.imageSmoothingQuality='high';
  ctx.drawImage(bi,0,0,1,1);
  if(!act)return;
  ctx.save();trace(0);ctx.clip();ctx.clearRect(0,0,1,1);ctx.restore();
  ctx.save();trace(1.4/S);ctx.clip();ctx.drawImage(ri,0,0,1,1);ctx.restore();
}
function frame(ts){
  var dt=prev===null?.016:Math.min((ts-prev)/1000,.034);prev=ts;T=ts/1000;
  if(intro){
    if(t0===null)t0=ts+900;
    var p=clamp((ts-t0)/2600,0,1);
    if(ts>t0){tx=.2+.62*ease(p);ty=.4+.1*Math.sin(p*Math.PI*2);lm=ts}
    if(p>=1)intro=false;
  }
  var act=false;
  sh.forEach(function(s){
    var alive=lm>0&&(ts-lm)<2600+s.i*700;
    var Tx=tx+s.ox+Math.sin(ts/(700+s.i*130)+s.i)*.012,Ty=ty+s.oy+Math.cos(ts/(830+s.i*90)+s.i*2)*.012,tR=alive?s.sz:0;
    if(reduce){s.x=Tx;s.y=Ty;s.R=tR}
    else{
      var c=2*.55*Math.sqrt(s.k);
      s.vx+=((Tx-s.x)*s.k-s.vx*c)*dt;s.vy+=((Ty-s.y)*s.k-s.vy*c)*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
      s.vR+=((tR-s.R)*40-s.vR*9)*dt;s.R+=s.vR*dt;
    }
    if(s.R<0){s.R=0;s.vR=0}
    var sp=Math.hypot(s.vx,s.vy);s.st+=(clamp(sp*.16,0,.5)-s.st)*.15;if(sp>.05)s.ang=Math.atan2(s.vy,s.vx);
    if(s.R>.003)act=true;
  });
  if((act||wasAct||dirty)&&bi.complete&&ri.complete){draw(act);dirty=false}
  wasAct=act;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
